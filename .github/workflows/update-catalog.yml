name: Update Terraria research catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Retrieve official research items and counts
        run: python scripts/update_catalog.py
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-base.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Atualizar catálogo do Modo Jornada a partir da Terraria Wiki"
          git push
