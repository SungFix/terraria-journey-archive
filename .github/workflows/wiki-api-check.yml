name: Verify Terraria Wiki integration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wiki-api-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check official MediaWiki API response
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          host='https://terraria.wiki.gg/api.php'
          for kind,args in [
           ('parse',{'action':'parse','page':'Iron_Pickaxe','prop':'text|displaytitle','format':'json','origin':'*'}),
           ('query',{'action':'query','meta':'siteinfo','siprop':'rightsinfo','format':'json','origin':'*'})]:
           url=host+'?'+urllib.parse.urlencode(args)
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'JourneyArchiveWikiCheck/1.0 (Noncommercial independent project)'})
            with urllib.request.urlopen(req,timeout=14) as r:
              body=r.read(2000)
              print(kind,'STATUS',r.status,'CORS',r.headers.get('access-control-allow-origin'),'TYPE',r.headers.get('content-type'),'SNIPPET',body[:180].decode('utf-8','replace'))
           except Exception as e:
            print(kind,'ERROR',type(e).__name__,str(e)[:240])
          print('--- more wiki endpoint checks ---')
          import re, html as h
          for locale,title in [('pt','Picareta de Ferro'),('es','Pico de hierro'),('en','Iron Pickaxe')]:
           pref='' if locale=='en' else '/'+locale
           params={'action':'parse','page':title,'prop':'text|displaytitle','format':'json','origin':'*'}
           try:
            req=urllib.request.Request('https://terraria.wiki.gg'+pref+'/api.php?'+urllib.parse.urlencode(params),headers={'User-Agent':'JourneyArchiveWikiCheck/1.0'})
            with urllib.request.urlopen(req,timeout=18) as res:
             obj=json.loads(res.read(5000000))
             print(locale, 'status',res.status,'cors',res.headers.get('access-control-allow-origin'),'title',obj.get('parse',{}).get('title'),'error',obj.get('error',{}).get('code'))
           except Exception as e: print(locale,'ERROR',type(e).__name__,str(e)[:150])
          try:
           params={'action':'parse','page':'Journey_Mode/Research_list','prop':'text','format':'json','origin':'*'}
           req=urllib.request.Request('https://terraria.wiki.gg/api.php?'+urllib.parse.urlencode(params),headers={'User-Agent':'JourneyArchiveWikiCheck/1.0'})
           with urllib.request.urlopen(req,timeout=38) as res:
            obj=json.load(res)
            body=obj.get('parse',{}).get('text',{}).get('*','')
            print('RESEARCH_LIST html_len',len(body),'tr',body.count('<tr'),'tables',body.count('<table'))
            for row in re.findall(r'<tr[^>]*>.*?</tr>',body,re.I|re.S)[:12]:
             txt=re.sub(r'<[^>]+>',' ',row)
             print('ROW',h.unescape(re.sub(r'\\s+',' ',txt).strip())[:260])
            with open('research_list.html','w',encoding='utf-8') as o:o.write(body)
          except Exception as e: print('RESEARCH_LIST_ERROR',type(e).__name__,str(e)[:180])
          PY
      - name: Capture real article rendering fixture
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          for lng,title in [('pt','Picareta de Ferro'),('en','Zenith')]:
            prefix='' if lng=='en' else '/'+lng
            url='https://terraria.wiki.gg'+prefix+'/api.php?'+urllib.parse.urlencode({'action':'parse','page':title,'prop':'text|displaytitle','format':'json','origin':'*'})
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'JourneyArchiveQA/1.0'}),timeout=35) as resp:
              data=json.load(resp)
            content=data.get('parse',{}).get('text',{}).get('*','')
            print(lng,'article length',len(content))
            assert len(content)>5000
            with open('article-'+lng+'.html','w',encoding='utf8') as out:out.write(content)
          PY
      - name: Save real articles
        uses: actions/upload-artifact@v4
        with:
          name: terraria-wiki-article-fixtures
          path: |
            article-pt.html
            article-en.html
          if-no-files-found: error
      - name: Save research-list diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraria-research-list-html
          path: research_list.html
          if-no-files-found: ignore
