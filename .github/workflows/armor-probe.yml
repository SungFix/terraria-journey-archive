name: Diagnostics for Terraria armor pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/qa-armor-probe.py'
      - '.github/workflows/armor-probe.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Inspect redirects, DOM structure and sprite images
        run: python scripts/qa-armor-probe.py
