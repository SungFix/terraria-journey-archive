name: Testar artigos e imagens individuais de armaduras
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/app.js'
      - 'assets/app.css'
      - 'index.html'
      - 'scripts/qa-armor-browser.mjs'
      - '.github/workflows/armor-browser.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch real armor articles with redirects enabled
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.parse, urllib.request
          dst=pathlib.Path('tests/armor-api-fixtures')
          dst.mkdir(parents=True,exist_ok=True)
          cases=[
            ('en','Molten Helmet'),('pt','Elmo Derretido'),
            ('en','Molten Breastplate'),('en','Molten Greaves'),
            ('en','Copper Helmet'),('en','Hallowed Helmet'),
            ('en','Solar Flare Helmet'),('en','Nebula Helmet')]
          for locale,title in cases:
            q=urllib.parse.urlencode({'action':'parse','page':title,
                                    'prop':'text|displaytitle|revid','redirects':1,
                                    'format':'json','origin':'*'})
            url='https://terraria.wiki.gg'+('/pt' if locale=='pt' else '')+'/api.php?'+q
            req=urllib.request.Request(url,headers={'User-Agent':'JourneyArchiveArmorQA/1.0'})
            with urllib.request.urlopen(req,timeout=40) as response: data=json.load(response)
            if not data.get('parse',{}).get('text',{}).get('*'):
              raise RuntimeError(f'No armor article: {locale}, {title}')
            filename=locale+'_'+title.replace(' ','_')+'.json'
            (dst/filename).write_text(json.dumps(data),encoding='utf8')
            if locale=='pt':
              alias=locale+'_'+data['parse']['title'].replace(' ','_')+'.json'
              (dst/alias).write_text(json.dumps(data),encoding='utf8')
            print(locale,title,'->',data['parse']['title'],len(data['parse']['text']['*']))
          PY
      - name: Run armor article & sprite browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/armor-web.log 2>&1 &
          sleep 2
          node scripts/qa-armor-browser.mjs | tee /tmp/armor-qa-results.json
      - name: Upload screenshots and diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terraria-Armor-Articles-QA
          path: |
            /tmp/armor-qa-*.png
            /tmp/armor-qa-results.json
          if-no-files-found: warn
