name: Aplicativo Windows - Journey Sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'data/persistent-items.json'
      - '.github/workflows/build-sync-windows.yml'
jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install cryptography pyinstaller
      - name: Gerar aplicativo exe
        run: pyinstaller --noconfirm --clean --onefile --console --name JourneyArchiveSync --add-data "data/persistent-items.json;data" companion/sync.py
      - uses: actions/upload-artifact@v4
        with:
          name: JourneyArchiveSync-Windows
          path: dist/JourneyArchiveSync.exe
          if-no-files-found: error
