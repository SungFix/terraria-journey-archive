name: Aplicativo Windows - Journey Sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'tests/**'
      - 'data/persistent-items.json'
      - '.github/workflows/build-sync-windows.yml'
jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install cryptography pyinstaller "terraria-player @ git+https://github.com/royalrizen/Terraria-Plr-Editor.git@0c514f6e2225c961155b9350068c2b20ef8ac833"
      - name: Verificar biblioteca de leitura 1.4.5
        run: python -c "from terraria_player import PlayerParser; print(PlayerParser.__name__)"
      - name: Testar leitura segura de pesquisas
        run: python -m unittest discover -s tests -v
      - name: Gerar aplicativo exe
        run: pyinstaller --noconfirm --clean --onefile --console --name JourneyArchiveSync --add-data "data/persistent-items.json;data" companion/sync.py
      - uses: actions/upload-artifact@v4
        with:
          name: JourneyArchiveSync-Windows
          path: dist/JourneyArchiveSync.exe
          if-no-files-found: error
