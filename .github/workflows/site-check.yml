name: Verificar Journey Archive Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'wiki.html'
      - 'assets/**'
      - 'data/catalog-base.json'
      - '.github/workflows/site-check.yml'
jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check assets/app.js
      - name: Verify local item catalog and integrated article route
        run: |
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('.')
          for filename in ('index.html','wiki.html','assets/app.css','assets/app.js','data/catalog-base.json'):
              assert (root/filename).is_file(),filename
          home=(root/'index.html').read_text()
          script=(root/'assets/app.js').read_text()
          catalog=json.loads((root/'data/catalog-base.json').read_text())
          assert len(catalog['items'])>=6100, 'current list incomplete'
          assert len(set(row['id'] for row in catalog['items']))==len(catalog['items'])
          assert all(row['qty']>0 for row in catalog['items'])
          assert 'assets/app.js' in home and 'assets/app.css' in home
          assert 'detailView' in home and 'itemGrid' in home
          assert 'history.pushState' in script and 'action:' in script and 'parse' in script
          assert 'journey-archive-auto-sync-v1' in script
          assert 'journey-archive-marked-v1' in script
          print('OK:',len(catalog['items']),'researchable Terraria items; one integrated wiki page.')
          PY
      - name: Prepare testable static site
        uses: actions/upload-artifact@v4
        with:
          name: JourneyArchive-Web
          path: |
            index.html
            wiki.html
            assets/app.css
            assets/app.js
            data/catalog-base.json
          if-no-files-found: error
