name: Inspect Terraria item icon markup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-inline-item.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official Wiki inline item markup
        run: |
          python3 - <<'PY'
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import re,json,html
          for locale,page in [('pt','Picareta de Ferro'),('en','Iron Pickaxe')]:
              url='https://terraria.wiki.gg'+('/pt' if locale=='pt' else '')+'/api.php?'+urlencode({'action':'parse','page':page,'prop':'text','format':'json','origin':'*'})
              with urlopen(Request(url,headers={'User-Agent':'JourneyArchive-ItemMarkupQA/1.0'}),timeout=50) as resp:
                  markup=json.load(resp)['parse']['text']['*']
              print('PAGE',page,'SIZE',len(markup))
              for q in (['Barra de Ferro','Iron Bar'] if locale=='pt' else ['Iron Bar','Wood']):
                  matches=list(re.finditer(re.escape(q),markup,re.I))
                  print('TERM',q,'MATCHES',len(matches))
                  for match in matches[:5]:
                      start=max(0,match.start()-700);end=min(len(markup),match.end()+400)
                      print('EXCERPT',html.unescape(markup[start:end]).replace('\\n',' ')[:1300])
          PY
