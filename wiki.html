<p>A wiki agora faz parte da lista de itens do Journey Archive.</p>
<p><a style="color:#a6eeb0" href="./">Abrir o Journey Archive</a></p>
<script>
(function(){
const url=new URL('./',location.href);
for(const key of ['item','article'])if(new URLSearchParams(location.search).has(key)){
 url.searchParams.set(key,new URLSearchParams(location.search).get(key));break;
}
location.replace(url.toString());
})();
</script>
